mode: internship            # internship | job  (job = new-grad / SDE-1 filters)

# A job is kept if its location contains any of these (case-insensitive).
locations: [India, Bengaluru, Bangalore, Hyderabad, Pune, Chennai, Mumbai, Gurgaon, Gurugram, Noida, Delhi]   # countryless "Remote" is always allowed
allow_any_location: false   # true = also keep US/EU roles

title_include: [intern, internship, trainee, apprentice, co-op, "summer analyst"]
title_exclude: [senior, staff, principal, lead, manager, director, phd, "post-doc", postdoc, mba, sales, marketing, legal, recruit, "account executive", hr ]
job_mode_include: [new grad, graduate, "sde 1", "sde i", "software engineer i", entry level, associate engineer]

max_age_days: 30            # ignore postings older than this

match:
  prefilter_keep: 0.4       # keep the top 40% by vector similarity for scoring
  llm_max_per_run: 20       # LLM scoring calls per discovery run (keeps Groq well inside its free tier)
  alert_threshold: 70
  hot_threshold: 85
  max_alerts_per_run: 10

jobspy:
  enabled: true
  sites: [linkedin, indeed, naukri, glassdoor, google]
  search_terms: [software engineer intern, security intern]   # keep short: LinkedIn rate-limits (429)
  location: India
  results_wanted: 25
  hours_old: 72

simplify:
  enabled: true
  url: https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/dev/.github/scripts/listings.json

sources:
  internshala: [computer-science-internship, python-django-internship, web-development-internship,
                machine-learning-internship, cyber-security-internship, data-science-internship, backend-development-internship]
  unstop: [software, developer, security, machine learning, data]
  amazon: [IND]            # ISO-3 country codes; add USA etc. if allow_any_location
  remotive: true
  remoteok: true
  hn: true                 # Hacker News "Who is hiring?" posts that mention interns

outreach:
  daily_cap: 15            # max emails sent per day (cold + follow-ups)
  followup_days: 5         # one follow-up if no reply after this many days, then stop
  max_followups: 1
  word_range: [90, 150]    # cold email body length
  sender_name: Deepanshu Agarwal

apply:
  answers: profile/answers.yaml

tracking:
  gmail_query_days: 14     # how far back to scan your inbox for application updates
  gmail_app_in_testing: false  # Google app published "In production" (16 Oct 2026). Was "Testing" → Telegram reminder before the 7-day login expiry.
                               # Set to false if you publish the app ("In production").

digest:
  hour: 21                 # daily digest at 21:00 local time
  weekly_day: sun          # weekly review report

# AI providers: FREE TIERS ONLY. Limits below were read from this Groq account's response headers (Oct 2026):
# each Groq model allows 1,000 requests/day and 8,000 tokens/minute on the free plan, separately per model.
# Daily caps sit below the free limits, calls are paced under the per-minute limit, and over a cap the bot moves to the
# next provider, then to keyword scoring / templates. Live usage: dashboard → Activity.
llm:
  score_chain: [groq_small, groq_alt, ollama]                       # job scoring, email classification, summaries
  write_chain: [groq_large, gemini, groq_alt, ollama]               # emails, resume rewording, prep packs
  providers:
    groq_small: {model: qwen/qwen3.8-27b, max_requests_per_day: 700, max_tokens_per_day: 150000, tokens_per_minute: 7000}
    groq_large: {model: openai/gpt-oss-120b, reasoning_effort: low, max_requests_per_day: 300, max_tokens_per_day: 100000, tokens_per_minute: 7000}
    groq_alt: {model: openai/gpt-oss-20b, reasoning_effort: low, max_requests_per_day: 500, max_tokens_per_day: 100000, tokens_per_minute: 7000}
    gemini: {model: auto, max_requests_per_day: 15, max_tokens_per_day: 60000}   # auto = newest stable Flash-Lite
    ollama: {}                                                      # local, unlimited (only if installed)
  max_output_tokens: {score: 700, write: 1500}                      # gpt-oss counts hidden reasoning in these
  warn_at: 0.8                                                      # Telegram note at 80% of a cap
